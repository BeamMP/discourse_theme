show_footer:
  type: bool
  default: true
  description: "Show the BeamMP footer (social links, Patreon, About / Privacy / Terms) at the bottom of every page, matching beammp.com."

show_hero_stats:
  type: bool
  default: true
  description: "Show forum stats (members, topics, posts) in the homepage welcome banner. Hidden automatically if Discourse does not allow the viewer to see about-page stats."

show_game_stats:
  type: bool
  default: true
  description: "Show live players online and public servers in the welcome banner (from the metrics URL below). Quietly hidden if the request fails."

game_stats_url:
  type: string
  default: "https://api.beammp.com/metrics"
  description: "Prometheus-style metrics endpoint with beammp_players_online and beammp_public_servers. The API must allow this forum's origin via CORS."
